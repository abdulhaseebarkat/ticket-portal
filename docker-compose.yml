services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: plantit
      POSTGRES_PASSWORD: plantit
      POSTGRES_DB: plant_it_support
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: plant_it_support
      DB_USERNAME: plantit
      DB_PASSWORD: plantit
      # Real random value - MUST be overridden (via a real .env file, never
      # committed) for any deployment beyond local testing. Generate your
      # own with, e.g., PowerShell:
      #   $b=New-Object byte[] 48; (New-Object Security.Cryptography.RNGCryptoServiceProvider).GetBytes($b); [Convert]::ToBase64String($b)
      APP_AUTH_TOKEN_SECRET: ${APP_AUTH_TOKEN_SECRET:-Lgq2H9uKMg/cjQaHgYvyVUMQaxDYmUhGubAuiwvkumQxa5am/0vwgpmKYI8c/3mG}
      # Whatever origin(s) the browser actually loads the frontend from,
      # beyond localhost:5173 (always allowed already) - e.g.
      # http://172.17.6.114:5173 while testing on a LAN server, or
      # https://itportal.yourcompany.com once there's a real domain.
      # Comma-separated for more than one. Required or every login (and
      # every other API call) 403s - see CorsConfig.java.
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-}
      APP_AUTH_SEED_EMAIL: ${APP_AUTH_SEED_EMAIL:-it.support@slmtires.com}
      APP_AUTH_SEED_PASSWORD: ${APP_AUTH_SEED_PASSWORD:-slmtires@123}
      WHATSAPP_BRIDGE_SECRET: ${WHATSAPP_BRIDGE_SECRET:-demo-bridge-secret}
      WHATSAPP_MEDIA_PATH: /data/whatsapp-media
      # "mock" (default, the built-in keyword classifier), "groq", or
      # "gemini" (both AI-backed) - set via a real .env file, never
      # committed. Switching back to mock is config-only, no rebuild of
      # logic needed.
      CLASSIFICATION_PROVIDER: ${CLASSIFICATION_PROVIDER:-mock}
      # Required only when CLASSIFICATION_PROVIDER=groq. Get one free at
      # console.groq.com - no credit card needed. Never commit a real key.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      GROQ_TIMEOUT_MS: ${GROQ_TIMEOUT_MS:-8000}
      # Required only when CLASSIFICATION_PROVIDER=gemini. Get one free at
      # aistudio.google.com - no credit card needed. Never commit a real key.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_TIMEOUT_MS: ${GEMINI_TIMEOUT_MS:-8000}
    ports:
      - '8080:8080'
    volumes:
      - whatsapp-media:/data/whatsapp-media
    depends_on:
      - postgres
  whatsapp-bridge:
    build:
      context: ./whatsapp-bridge
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8080
      BRIDGE_SHARED_SECRET: ${WHATSAPP_BRIDGE_SECRET:-demo-bridge-secret}
      WHATSAPP_HISTORY_BACKFILL_HOURS: ${WHATSAPP_HISTORY_BACKFILL_HOURS:-48}
    volumes:
      - whatsapp-bridge-auth:/app/auth
    depends_on:
      - backend
  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - '5173:80'
    depends_on:
      - backend
volumes:
  postgres-data:
  whatsapp-media:
  whatsapp-bridge-auth:
