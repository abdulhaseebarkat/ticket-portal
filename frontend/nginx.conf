server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same routing Vite's dev-server proxy does locally: API calls and
    # served complaint-photo attachments go to the backend container.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /media/ {
        proxy_pass http://backend:8080;
    }

    # React Router - any other path falls back to index.html so client-side
    # routing works on a hard refresh/direct link.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
